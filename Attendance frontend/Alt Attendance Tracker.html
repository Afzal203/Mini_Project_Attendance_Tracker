<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alt Attendance Tracker</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1d1d1b;--mute:#6b6a64;--line:#e2e0d8;--acc:#5b5bd6;--ok:#2f9e6b;--okbg:#d9f2e6;--miss:#f1efe8;--today:#e8a317;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#212126;--text:#ecebe6;--mute:#9a9992;--line:#34343b;--acc:#8c8cf0;--ok:#55c796;--okbg:#1f4034;--miss:#2a2a30}}
:root[data-theme="dark"]{--bg:#17171a;--card:#212126;--text:#ecebe6;--mute:#9a9992;--line:#34343b;--acc:#8c8cf0;--ok:#55c796;--okbg:#1f4034;--miss:#2a2a30}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 14px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--mute);font-size:12px}
form,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);min-width:0;flex:1 1 140px}
button{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button:hover{filter:brightness(.96)}
.bar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 8px;gap:8px;flex-wrap:wrap}
.wrap{overflow-x:auto}
table{border-collapse:separate;border-spacing:3px;width:100%}
th{font-size:11px;color:var(--mute);font-weight:500;text-align:center;padding:2px}
th.t{color:var(--today);font-weight:700}
td.n{min-width:150px;padding-right:8px;white-space:nowrap}
td.n small{display:block;color:var(--mute);font-size:12px}
td.c{text-align:center}
.cell{width:30px;height:30px;border-radius:7px;background:var(--miss);border:1px solid var(--line);padding:0;font-size:14px;color:transparent}
.cell.on{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.cell.t{outline:2px solid var(--today);outline-offset:1px}
td.s{font-size:12px;color:var(--mute);white-space:nowrap;padding-left:6px}
.x{border:none;background:none;color:var(--mute);padding:4px 8px}
.empty{color:var(--mute);text-align:center;padding:24px}
textarea{width:100%;min-height:70px;font:12px monospace;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:8px}
</style>
</head>
<body>
<main>
  <h1>🛡️ Alt Attendance Tracker</h1>
  <p class="sub">Tap a square to mark an alt as checked in for that day. Data is saved in this browser.</p>

  <div class="stats">
    <div class="stat"><b id="sToday">0/0</b><span>Checked in today</span></div>
    <div class="stat"><b id="sRate">0%</b><span>Attendance (shown range)</span></div>
    <div class="stat"><b id="sBest">–</b><span>Best current streak</span></div>
  </div>

  <div class="card" style="margin-top:14px">
    <form id="f">
      <input id="name" placeholder="Alt name" required maxlength="40">
      <input id="cls" placeholder="Class / role (optional)" maxlength="40">
      <button class="p" type="submit">Add alt</button>
    </form>
  </div>

  <div class="bar">
    <div class="row">
      <button id="prev">← Earlier</button>
      <button id="next">Later →</button>
      <button id="now">Today</button>
    </div>
    <div class="row">
      <button id="all">Check in all today</button>
    </div>
  </div>

  <div class="card wrap"><table id="tbl"></table></div>

  <details class="card">
    <summary>Backup / restore</summary>
    <div class="row" style="margin-top:8px">
      <button id="exp">Export</button><button id="imp">Import</button><button id="theme">Toggle theme</button>
    </div>
    <textarea id="io" placeholder="Export shows JSON here. Paste JSON and press Import to restore."></textarea>
  </details>
</main>
<script>
const KEY='altAttendance.v1', DAYS=14;
let alts=[], offset=0;
try{alts=JSON.parse(localStorage.getItem(KEY)||'[]')||[]}catch(e){alts=[]}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(alts))}catch(e){}};
const $=id=>document.getElementById(id);
const key=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayKey=()=>key(new Date());
function range(){const out=[];for(let i=DAYS-1;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i-offset);out.push(d)}return out}
function streak(a){let n=0,d=new Date();if(!a.days[key(d)])d.setDate(d.getDate()-1);
  while(a.days[key(d)]){n++;d.setDate(d.getDate()-1)}return n}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){
  const ds=range(), tk=todayKey();
  let h='<tr><th></th>'+ds.map(d=>`<th class="${key(d)===tk?'t':''}">${d.toLocaleDateString(undefined,{weekday:'short'})}<br>${d.getDate()}</th>`).join('')+'<th>Streak</th><th>Rate</th><th></th></tr>';
  if(!alts.length) h+=`<tr><td colspan="${DAYS+4}" class="empty">No alts yet. Add one above.</td></tr>`;
  let hit=0,tot=0,best=0,today=0;
  alts.forEach(a=>{
    const on=ds.filter(d=>a.days[key(d)]).length; hit+=on; tot+=DAYS;
    const st=streak(a); best=Math.max(best,st); if(a.days[tk])today++;
    h+=`<tr><td class="n"><b>${esc(a.name)}</b>${a.cls?`<small>${esc(a.cls)}</small>`:''}</td>`+
      ds.map(d=>{const k=key(d),o=a.days[k];return `<td class="c"><button class="cell ${o?'on':''} ${k===tk?'t':''}" data-id="${a.id}" data-k="${k}" aria-label="${esc(a.name)} ${k}">✓</button></td>`}).join('')+
      `<td class="s">${st}d 🔥</td><td class="s">${Math.round(on/DAYS*100)}%</td><td><button class="x" data-del="${a.id}" title="Remove">✕</button></td></tr>`;
  });
  $('tbl').innerHTML=h;
  $('sToday').textContent=today+'/'+alts.length;
  $('sRate').textContent=(tot?Math.round(hit/tot*100):0)+'%';
  $('sBest').textContent=alts.length?best+'d':'–';
}
$('f').onsubmit=e=>{e.preventDefault();const n=$('name').value.trim();if(!n)return;
  alts.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:n,cls:$('cls').value.trim(),days:{}});
  $('name').value='';$('cls').value='';save();render()};
$('tbl').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.del){const a=alts.find(x=>x.id===b.dataset.del);if(a&&confirm('Remove '+a.name+'?')){alts=alts.filter(x=>x!==a);save();render()}return}
  if(b.dataset.k){const a=alts.find(x=>x.id===b.dataset.id);if(a.days[b.dataset.k])delete a.days[b.dataset.k];else a.days[b.dataset.k]=true;save();render()}};
$('prev').onclick=()=>{offset+=7;render()};
$('next').onclick=()=>{offset=Math.max(0,offset-7);render()};
$('now').onclick=()=>{offset=0;render()};
$('all').onclick=()=>{const k=todayKey();alts.forEach(a=>a.days[k]=true);save();render()};
$('exp').onclick=()=>{$('io').value=JSON.stringify(alts)};
$('imp').onclick=()=>{try{const v=JSON.parse($('io').value);if(!Array.isArray(v))throw 0;alts=v;save();render()}catch(e){alert('Invalid JSON')}};
$('theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};
render();
</script>
</body>
</html>
